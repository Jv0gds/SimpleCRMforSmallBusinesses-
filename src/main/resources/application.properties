# ========================================
# Simple CRM Application Configuration
# ========================================

# 应用基本配置
spring.application.name=simple-crm
server.port=8081

# ========================================
# 数据库配置（MySQL）
# ========================================
# 注意：首次运行前，请确保已创建数据库 crm_db
# 创建命令：CREATE DATABASE crm_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

# MySQL 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/crm_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# JPA / Hibernate 配置
# ========================================
# Hibernate DDL 模式：none（生产）、validate（验证）、update（更新）、create（创建）、create-drop（创建后删除）
spring.jpa.hibernate.ddl-auto=none

# 显示 SQL 语句（开发环境建议开启，生产环境建议关闭）
spring.jpa.show-sql=true

# 格式化 SQL 语句
spring.jpa.properties.hibernate.format_sql=true

# SQL 方言
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 使用新的 ID 生成器
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# 启用批量操作
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================
# SQL 初始化配置
# ========================================
# 是否初始化数据库（首次运行时设置为 always，后续可改为 never）
spring.sql.init.mode=always

# 数据库脚本位置
spring.sql.init.schema-locations=classpath:db/schema.sql
#spring.sql.init.data-locations=classpath:db/data.sql

# 指定脚本编码
spring.sql.init.encoding=UTF-8

# 出错时继续执行
spring.sql.init.continue-on-error=false

# ========================================
# 日志配置
# ========================================
# 应用日志级别
logging.level.root=INFO
logging.level.com.crm=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 日志输出格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# Web 配置
# ========================================
# 编码配置
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/

# ========================================
# 开发工具配置
# ========================================
# 启用 DevTools
spring.devtools.restart.enabled=true

# 排除不需要重启的资源
spring.devtools.restart.exclude=static/**,public/**,templates/**
