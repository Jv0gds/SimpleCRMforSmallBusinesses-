<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Simple CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>User Profile</h2>
        <form id="profileForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" readonly>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <hr>
            <p>Change Password (leave blank if you don't want to change it)</p>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
            </div>
            <button type="submit">Update Profile</button>
        </form>
        <div id="message" class="message"></div>
        <div class="logout-link">
             <a href="/login.html">Logout</a>
        </div>
    </div>

    <script>
        // Frontend logic to fetch data and handle form submission will be added in the next step.
        // For now, you can populate the form with dummy data for styling purposes.
        document.getElementById('email').value = 'user@example.com';
        document.getElementById('username').value = 'current_user';
    </script>
</body>
</html>
