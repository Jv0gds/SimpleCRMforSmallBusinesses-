<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Simple CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>User Profile</h2>
        
        <!-- Role Information Section -->
        <div id="roleSection" class="role-section" style="background-color: #f8f9fa; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
            <h3 style="margin-top: 0; color: #333;">Your Roles</h3>
            <div id="rolesList" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
        </div>
        
        <!-- Quick Links based on role -->
        <div id="quickLinks" class="quick-links" style="margin-bottom: 1.5rem; display: none;">
            <h3 style="color: #333;">Quick Links</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                <a id="adminLink" href="/admin-dashboard.html" style="display: none; padding: 0.5rem 1rem; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px;">Admin Dashboard</a>
                <a id="managerLink" href="/manager-dashboard.html" style="display: none; padding: 0.5rem 1rem; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">Manager Dashboard</a>
                <a id="salesLink" href="/sales-dashboard.html" style="display: none; padding: 0.5rem 1rem; background-color: #17a2b8; color: white; text-decoration: none; border-radius: 4px;">Sales Dashboard</a>
            </div>
        </div>
        
        <h3 style="color: #333;">Profile Information</h3>
        <form id="profileForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" readonly>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <hr>
            <p>Change Password (leave blank if you don't want to change it)</p>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
            </div>
            <button type="submit">Update Profile</button>
        </form>
        <div id="message" class="message"></div>
        <div class="logout-link">
             <a href="/login.html">Logout</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const profileForm = document.getElementById('profileForm');
            const messageDiv = document.getElementById('message');

            // Get user ID from localStorage (set during login)
            const userId = localStorage.getItem('userId') || 1;

            // Function to display roles
            function displayRoles(roles) {
                const rolesList = document.getElementById('rolesList');
                const quickLinks = document.getElementById('quickLinks');
                const adminLink = document.getElementById('adminLink');
                const managerLink = document.getElementById('managerLink');
                const salesLink = document.getElementById('salesLink');
                
                rolesList.innerHTML = '';
                let hasLinks = false;
                
                if (roles && roles.length > 0) {
                    roles.forEach(role => {
                        const badge = document.createElement('span');
                        badge.style.cssText = 'padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; font-weight: 500;';
                        
                        // Color code based on role level
                        switch(role.name) {
                            case 'ADMIN':
                                badge.style.backgroundColor = '#dc3545';
                                badge.style.color = 'white';
                                badge.textContent = '🛡️ Administrator';
                                adminLink.style.display = 'inline-block';
                                hasLinks = true;
                                break;
                            case 'SALES_MANAGER':
                                badge.style.backgroundColor = '#28a745';
                                badge.style.color = 'white';
                                badge.textContent = '📊 Sales Manager';
                                managerLink.style.display = 'inline-block';
                                hasLinks = true;
                                break;
                            case 'SALES_REP':
                                badge.style.backgroundColor = '#17a2b8';
                                badge.style.color = 'white';
                                badge.textContent = '💼 Sales Representative';
                                salesLink.style.display = 'inline-block';
                                hasLinks = true;
                                break;
                            case 'USER':
                                badge.style.backgroundColor = '#6c757d';
                                badge.style.color = 'white';
                                badge.textContent = '👤 User';
                                break;
                            case 'GUEST':
                                badge.style.backgroundColor = '#e9ecef';
                                badge.style.color = '#495057';
                                badge.textContent = '👥 Guest';
                                break;
                            default:
                                badge.style.backgroundColor = '#f8f9fa';
                                badge.style.color = '#495057';
                                badge.textContent = role.name;
                        }
                        
                        rolesList.appendChild(badge);
                    });
                    
                    if (hasLinks) {
                        quickLinks.style.display = 'block';
                    }
                } else {
                    rolesList.textContent = 'No roles assigned';
                }
            }

            // Fetch user profile with roles on page load
            fetch('/api/user/profile-with-roles', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Id': userId
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch user profile');
                }
                return response.json();
            })
            .then(result => {
                if (result.success && result.data) {
                    document.getElementById('email').value = result.data.email;
                    document.getElementById('username').value = result.data.username;
                    
                    // Display roles
                    displayRoles(result.data.roles);
                    
                    // Save roles to localStorage for future use
                    if (result.data.roles) {
                        localStorage.setItem('userRoles', JSON.stringify(result.data.roles));
                    }
                }
            })
            .catch(error => {
                messageDiv.textContent = `Error: ${error.message}`;
                messageDiv.className = 'message error';
                
                // Try to display cached roles if available
                const cachedRoles = localStorage.getItem('userRoles');
                if (cachedRoles) {
                    try {
                        displayRoles(JSON.parse(cachedRoles));
                    } catch (e) {
                        console.error('Error parsing cached roles:', e);
                    }
                }
            });

            // Handle profile update
            profileForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const username = document.getElementById('username').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                const payload = {
                    username,
                    newPassword,
                    confirmPassword
                };
                
                // Only include password fields if they are filled
                if (!newPassword && !confirmPassword) {
                    delete payload.newPassword;
                    delete payload.confirmPassword;
                }


                fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Id': userId
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json().then(data => ({ ok: response.ok, data })))
                .then(({ ok, data }) => {
                    if (!ok) {
                        throw new Error(data.message || 'An unknown error occurred.');
                    }
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message success';
                    
                    // Clear password fields after successful update
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                })
                .catch(error => {
                    messageDiv.textContent = `Error: ${error.message}`;
                    messageDiv.className = 'message error';
                });
            });
            
            // Add logout functionality
            const logoutLink = document.querySelector('.logout-link a');
            if (logoutLink) {
                logoutLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    // Clear localStorage
                    localStorage.removeItem('userId');
                    localStorage.removeItem('userEmail');
                    localStorage.removeItem('userRoles');
                    // Redirect to login
                    window.location.href = '/login.html';
                });
            }
        });
    </script>
</body>
</html>
