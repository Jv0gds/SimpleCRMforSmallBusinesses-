<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="text-white text-2xl font-bold p-4 border-b border-gray-700">
                SimpleCRM
            </div>
            <nav class="flex-1 px-2 py-4 space-y-2">
                <a href="#/" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Home</a>
                <a href="#/dashboard" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Dashboard</a>
                <a href="#/deals" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Deals</a>
                <a href="#/leads" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Leads</a>
                <div>
                    <a href="#/customers" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Customers</a>
                    <div class="ml-4">
                         <a href="#/customers/companies" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Companies</a>
                         <a href="#/customers/contacts" class="block px-4 py-2 text-sm rounded hover:bg-gray-700">Contacts</a>
                    </div>
                </div>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <a href="profile.html" class="block w-full text-left px-4 py-2 text-sm rounded hover:bg-gray-700">Settings</a>
                <button id="logoutButton" class="w-full text-left block px-4 py-2 text-sm rounded hover:bg-gray-700">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 p-10 overflow-y-auto">
            <!-- Content will be loaded here by the router -->
        </main>

        <!-- Lead Creation Drawer -->
        <div id="lead-creation-drawer" class="fixed inset-y-0 right-0 transform translate-x-full transition-transform duration-300 ease-in-out bg-white w-96 shadow-lg z-50">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Create New Lead</h2>
                    <button id="close-drawer-button" class="text-gray-500 hover:text-gray-800">&times;</button>
                </div>
                <form>
                    <div class="mb-4">
                        <label for="lead-name" class="block text-sm font-medium text-gray-700">Name</label>
                        <input type="text" id="lead-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="lead-company" class="block text-sm font-medium text-gray-700">Company</label>
                        <input type="text" id="lead-company" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                     <div class="mb-4">
                        <label for="lead-phone" class="block text-sm font-medium text-gray-700">Phone</label>
                        <input type="tel" id="lead-phone" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="lead-status" class="block text-sm font-medium text-gray-700">Status</label>
                        <select id="lead-status" class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            <option>New</option>
                            <option>Contacted</option>
                            <option>Qualified</option>
                            <option>Unqualified</option>
                        </select>
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="cancel-drawer-button" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancel</button>
                        <button type="submit" id="save-lead-button" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Simple client-side router
        const routes = {
            '/': `
                <div class="container mx-auto px-4 py-8">
                    <div class="text-center mb-8">
                        <h1 class="text-4xl font-bold text-gray-800">Discover Opportunities</h1>
                        <p class="text-gray-600">Search for public companies and business opportunities.</p>
                    </div>
                    <div class="max-w-2xl mx-auto mb-8">
                        <input type="text" placeholder="Search for a company or opportunity..." class="w-full px-4 py-3 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <!-- Sample Card 1 -->
                        <div class="bg-white rounded-lg shadow-md overflow-hidden">
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-2">InnovateTech Solutions</h3>
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">Technology</span>
                                    <span class="bg-green-100 text-green-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">SaaS</span>
                                </div>
                                <p class="text-gray-600 mb-4">A leading provider of cloud-based software solutions for enterprise clients.</p>
                                <a href="#" class="font-semibold text-blue-600 hover:text-blue-800">View Details &rarr;</a>
                            </div>
                        </div>
                        <!-- Sample Card 2 -->
                        <div class="bg-white rounded-lg shadow-md overflow-hidden">
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-2">QuantumLeap Analytics</h3>
                                 <div class="flex flex-wrap gap-2 mb-4">
                                    <span class="bg-purple-100 text-purple-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">AI</span>
                                    <span class="bg-yellow-100 text-yellow-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">Big Data</span>
                                </div>
                                <p class="text-gray-600 mb-4">Pioneering AI-driven analytics to unlock business insights from complex datasets.</p>
                                <a href="#" class="font-semibold text-blue-600 hover:text-blue-800">View Details &rarr;</a>
                            </div>
                        </div>
                        <!-- Sample Card 3 -->
                        <div class="bg-white rounded-lg shadow-md overflow-hidden">
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-2">NextGen Logistics</h3>
                                 <div class="flex flex-wrap gap-2 mb-4">
                                    <span class="bg-red-100 text-red-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">Logistics</span>
                                    <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">Automation</span>
                                </div>
                                <p class="text-gray-600 mb-4">Revolutionizing supply chain management with automated logistics platforms.</p>
                                <a href="#" class="font-semibold text-blue-600 hover:text-blue-800">View Details &rarr;</a>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            '/dashboard': `
                <div class="container mx-auto px-4 py-8">
                    <h1 class="text-3xl font-bold text-gray-800 mb-6">Good morning, Sales Rep!</h1>
                    <!-- KPI Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-lg font-semibold text-gray-600 mb-2">Monthly Sales</h2>
                            <p id="dashboard-kpis-sales" class="text-4xl font-bold text-gray-800">$0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-lg font-semibold text-gray-600 mb-2">New Leads</h2>
                            <p id="dashboard-kpis-leads" class="text-4xl font-bold text-gray-800">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-lg font-semibold text-gray-600 mb-2">Tasks Due</h2>
                            <p id="dashboard-kpis-tasks" class="text-4xl font-bold text-gray-800">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-lg font-semibold text-gray-600 mb-2">Conversion Rate</h2>
                            <p class="text-4xl font-bold text-gray-800">25%</p>
                        </div>
                    </div>

                    <!-- Main Content Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <!-- My To-Do List -->
                        <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">My To-Do List</h2>
                            <ul id="dashboard-todo-list" class="space-y-4">
                                <!-- To-do items will be loaded here -->
                            </ul>
                        </div>

                        <!-- Leads to Follow Up -->
                        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">Leads to Follow Up</h2>
                            <table id="dashboard-leads-table" class="w-full text-left">
                                <thead>
                                    <tr class="border-b">
                                        <th class="py-2">Name</th>
                                        <th class="py-2">Company</th>
                                        <th class="py-2">Status</th>
                                        <th class="py-2"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Leads will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `,
            '/deals': '<h2>Deals</h2><p>Sales pipeline management.</p>',
            '/leads': `
                <div class="container mx-auto px-4 py-8">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-3xl font-bold text-gray-800">Leads</h1>
                        <button id="new-lead-button" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            + New Lead
                        </button>
                    </div>
                    <div class="mb-4">
                        <input type="text" placeholder="Search leads..." class="w-full px-4 py-2 border rounded-md">
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b">
                                    <th class="py-2">Name</th>
                                    <th class="py-2">Company</th>
                                    <th class="py-2">Job Title</th>
                                    <th class="py-2">Status</th>
                                    <th class="py-2">Owner</th>
                                    <th class="py-2"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="py-2">Jim Halpert</td>
                                    <td class="py-2">Dunder Mifflin</td>
                                    <td class="py-2">Sales Representative</td>
                                    <td class="py-2"><span class="bg-green-200 text-green-800 py-1 px-3 rounded-full text-xs">New</span></td>
                                    <td class="py-2">Andy Bernard</td>
                                    <td class="py-2"><a href="#" class="text-blue-600 hover:underline">Edit</a></td>
                                </tr>
                                <tr>
                                    <td class="py-2">Stanley Hudson</td>
                                    <td class="py-2">Dunder Mifflin</td>
                                    <td class="py-2">Sales Representative</td>
                                    <td class="py-2"><span class="bg-yellow-200 text-yellow-800 py-1 px-3 rounded-full text-xs">Contacted</span></td>
                                    <td class="py-2">Andy Bernard</td>
                                    <td class="py-2"><a href="#" class="text-blue-600 hover:underline">Edit</a></td>
                                </tr>
                                <tr>
                                    <td class="py-2">Phyllis Vance</td>
                                    <td class="py-2">Dunder Mifflin</td>
                                    <td class="py-2">Sales Representative</td>
                                    <td class="py-2"><span class="bg-blue-200 text-blue-800 py-1 px-3 rounded-full text-xs">Qualified</span></td>
                                    <td class="py-2">Andy Bernard</td>
                                    <td class="py-2"><a href="#" class="text-blue-600 hover:underline">Edit</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `,
            '/customers': '<h2>Customers</h2><p>Customer database.</p>',
            '/customers/companies': '<h2>Companies</h2><p>List of companies.</p>',
            '/customers/contacts': '<h2>Contacts</h2><p>List of contacts.</p>'
        };

        const content = document.getElementById('main-content');
        const drawer = document.getElementById('lead-creation-drawer');

        function closeDrawer() {
            drawer.classList.add('translate-x-full');
        }
        
        function openDrawer() {
            drawer.classList.remove('translate-x-full');
        }

        function router() {
            const path = window.location.hash.substring(1) || '/';
            content.innerHTML = routes[path] || '<h2>404 Not Found</h2>';

            if (path === '/dashboard') {
                loadDashboardData();
            }

            // Add event listener for the "New Lead" button if it exists on the page
            const newLeadButton = document.getElementById('new-lead-button');
            if (newLeadButton) {
                newLeadButton.addEventListener('click', openDrawer);
            }
        }

        async function loadDashboardData() {
            try {
                // Fetch KPIs
                const kpiResponse = await fetch('/api/dashboard/kpis');
                const kpis = await kpiResponse.json();
                document.querySelector('#dashboard-kpis-sales').textContent = kpis.monthlySales;
                document.querySelector('#dashboard-kpis-leads').textContent = kpis.newLeads;
                document.querySelector('#dashboard-kpis-tasks').textContent = kpis.pendingTasks;

                // Fetch To-Dos
                const todoResponse = await fetch('/api/dashboard/todos');
                const todos = await todoResponse.json();
                const todoList = document.querySelector('#dashboard-todo-list');
                todoList.innerHTML = todos.map(todo => `
                    <li class="flex items-center">
                        <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" ${todo.status === 'completed' ? 'checked' : ''}>
                        <label class="ml-3 block text-gray-900 ${todo.status === 'completed' ? 'line-through' : ''}">${todo.task}</label>
                    </li>
                `).join('');

                // Fetch Leads
                const leadsResponse = await fetch('/api/dashboard/leads');
                const leads = await leadsResponse.json();
                const leadsTable = document.querySelector('#dashboard-leads-table tbody');
                leadsTable.innerHTML = leads.map(lead => `
                    <tr>
                        <td class="py-2">${lead.name}</td>
                        <td class="py-2">${lead.company}</td>
                        <td class="py-2"><span class="bg-yellow-200 text-yellow-800 py-1 px-3 rounded-full text-xs">${lead.status}</span></td>
                        <td class="py-2"><a href="#" class="text-blue-600 hover:underline">View</a></td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        document.getElementById('close-drawer-button').addEventListener('click', closeDrawer);
        document.getElementById('cancel-drawer-button').addEventListener('click', closeDrawer);
        document.getElementById('lead-creation-drawer').addEventListener('submit', async (e) => {
            e.preventDefault();
            const leadData = {
                name: document.getElementById('lead-name').value,
                company: document.getElementById('lead-company').value,
                phone: document.getElementById('lead-phone').value,
                status: document.getElementById('lead-status').value,
            };

            try {
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(leadData),
                });

                if (response.ok) {
                    closeDrawer();
                    // Optionally, refresh the leads list or show a success message
                    alert('Lead created successfully!');
                } else {
                    alert('Failed to create lead.');
                }
            } catch (error) {
                console.error('Error creating lead:', error);
                alert('An error occurred while creating the lead.');
            }
        });

        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);

        // Logout functionality
        document.getElementById('logoutButton').addEventListener('click', function() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRoles');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
