<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Simple CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dashboard</h1>
            <button id="logoutButton" class="auth-button">Logout</button>
        </div>
        
        <p>Welcome, <span id="userEmail"></span>!</p>
        <p>This is your central hub. From here, you can manage your profile and access other features.</p>

        <div class="dashboard-links">
            <a href="profile.html" class="button-link">My Profile</a>
            <!-- More links can be added here as the application grows -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userEmail = localStorage.getItem('userEmail');
            const userId = localStorage.getItem('userId');

            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            const userEmailSpan = document.getElementById('userEmail');
            if (userEmail) {
                userEmailSpan.textContent = userEmail;
            } else {
                userEmailSpan.textContent = 'User';
            }

            const logoutButton = document.getElementById('logoutButton');
            logoutButton.addEventListener('click', function() {
                localStorage.removeItem('userId');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userRoles');
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
