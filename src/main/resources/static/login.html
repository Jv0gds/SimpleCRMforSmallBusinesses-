<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simple CRM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .message.success {
            color: #28a745;
        }
        .message.error {
            color: #dc3545;
        }
        .switch-form {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .switch-form a {
            color: #007bff;
            text-decoration: none;
        }
        .switch-form a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm" method="POST" action="/api/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="message" class="message"></div>
        <div class="switch-form">
            <p>Don't have an account? <a href="/register.html">Register here</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('loginForm');
            const messageDiv = document.getElementById('message');

            // Handle form submission with Fetch. This approach is compatible with Spring Security's
            // formLogin() filter chain, which now returns JSON thanks to our custom handlers.
            loginForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Spring Security's formLogin() expects form-urlencoded data by default.
                const formData = new URLSearchParams();
                formData.append('email', email);
                formData.append('password', password);

                fetch(loginForm.action, { // The action is "/api/login"
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    // We expect a JSON response from our custom success/failure handlers.
                    if (!response.ok) {
                        // For failure (e.g., 401), the failure handler returns a JSON body.
                        return response.json().then(err => Promise.reject(err));
                    }
                    return response.json();
                })
                .then(result => {
                    // This block executes on successful authentication (200 OK)
                    if (result.success && result.data) {
                        // SUCCESS: Store user info to localStorage
                        localStorage.setItem('userId', result.data.id);
                        localStorage.setItem('userEmail', result.data.email);

                        // Client-side redirect based on user role from response
                        const roles = result.data.roles || [];
                        let highestRole = roles.reduce((max, role) => max.level > role.level ? max : role, { name: 'GUEST', level: 0 });
                        
                        let targetUrl = '/dashboard.html'; // Default for regular USER
                        switch (highestRole.name) {
                            case 'ADMIN':
                                targetUrl = '/admin-dashboard.html';
                                break;
                            case 'SALES_MANAGER':
                                targetUrl = '/manager-dashboard.html';
                                break;
                            case 'SALES_REP':
                                targetUrl = '/sales-dashboard.html';
                                break;
                        }
                        window.location.href = targetUrl;
                    } else {
                        // Should not happen if success is true, but as a fallback:
                        messageDiv.textContent = result.message || 'Login failed!';
                        messageDiv.className = 'message error';
                    }
                })
                .catch(errorResult => {
                    // This block catches network errors or failures from the server (e.g., 401)
                    console.error('Login Error:', errorResult);
                    messageDiv.textContent = errorResult.message || 'An error occurred during login.';
                    messageDiv.className = 'message error';
                });
            });
        });
    </script>
</body>
</html>
