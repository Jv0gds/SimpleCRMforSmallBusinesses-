<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simple CRM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .message.success {
            color: #28a745;
        }
        .message.error {
            color: #dc3545;
        }
        .switch-form {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .switch-form a {
            color: #007bff;
            text-decoration: none;
        }
        .switch-form a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="message" class="message"></div>
        <div class="switch-form">
            <p>Don't have an account? <a href="/register.html">Register here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.textContent = '';
            messageDiv.className = 'message';

            if (!email || !password) {
                messageDiv.textContent = 'Please fill in all fields.';
                messageDiv.classList.add('error');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.textContent = 'Login successful! Redirecting...';
                    messageDiv.classList.add('success');
                    
                    // Save user ID to localStorage
                    if (result.data && result.data.id) {
                        localStorage.setItem('userId', result.data.id);
                        localStorage.setItem('userEmail', result.data.email);
                        
                        // Fetch user roles after successful login
                        try {
                            const rolesResponse = await fetch('/api/user/profile-with-roles', {
                                method: 'GET',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-User-Id': result.data.id
                                }
                            });
                            
                            if (rolesResponse.ok) {
                                const rolesResult = await rolesResponse.json();
                                if (rolesResult.success && rolesResult.data.roles) {
                                    // Save roles to localStorage
                                    localStorage.setItem('userRoles', JSON.stringify(rolesResult.data.roles));
                                    
                                    // Redirect based on highest role level
                                    const roles = rolesResult.data.roles;
                                    let highestLevel = 0;
                                    let redirectUrl = '/profile.html';
                                    
                                    roles.forEach(role => {
                                        if (role.level > highestLevel) {
                                            highestLevel = role.level;
                                            switch(role.name) {
                                                case 'ADMIN':
                                                    redirectUrl = '/admin-dashboard.html';
                                                    break;
                                                case 'SALES_MANAGER':
                                                    redirectUrl = '/manager-dashboard.html';
                                                    break;
                                                case 'SALES_REP':
                                                    redirectUrl = '/sales-dashboard.html';
                                                    break;
                                                case 'USER':
                                                    redirectUrl = '/profile.html';
                                                    break;
                                            }
                                        }
                                    });
                                    
                                    // Redirect after a short delay
                                    setTimeout(() => {
                                        window.location.href = redirectUrl;
                                    }, 1000);
                                } else {
                                    // No roles found, redirect to profile
                                    setTimeout(() => {
                                        window.location.href = '/profile.html';
                                    }, 1000);
                                }
                            }
                        } catch (roleError) {
                            console.error('Error fetching roles:', roleError);
                            // Still redirect to profile on error
                            setTimeout(() => {
                                window.location.href = '/profile.html';
                            }, 1000);
                        }
                    }
                } else {
                    messageDiv.textContent = result.message || 'Login failed. Please check your credentials.';
                    messageDiv.classList.add('error');
                }
            } catch (error) {
                console.error('Login error:', error);
                messageDiv.textContent = 'An error occurred. Please try again later.';
                messageDiv.classList.add('error');
            }
        });
    </script>
</body>
</html>
